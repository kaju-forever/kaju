const audio=document.getElementById('weddingAudio'), musicBtn=document.getElementById('musicBtn'), gate=document.getElementById('gate'), invite=document.getElementById('invite');let musicPlaying=true;
let currentTrack='',playRequest=0;
function playRandomTrack(){
  const request=++playRequest;
  let pool=g.musicTracks.filter(src=>src&&src!==currentTrack);
  if(!pool.length)pool=g.musicTracks.filter(Boolean);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  function attempt(){
    if(request!==playRequest||!musicPlaying)return;
    const src=pool.shift();
    if(!src){musicPlaying=false;musicBtn.textContent='♫ MUSIC OFF';return}
    currentTrack=src;
    let didFail=false;
    const skip=()=>{if(didFail||request!==playRequest)return;didFail=true;attempt()};
    audio.onerror=skip;
    audio.src=src;
    audio.load();
    audio.play().then(()=>{if(request===playRequest)musicBtn.textContent='♫ MUSIC ON'}).catch(error=>{
      if(request!==playRequest)return;
      if(error&&(error.name==='NotAllowedError'||error.name==='AbortError')){musicBtn.textContent='♫ MUSIC ON'}
      else skip();
    });
  }
  attempt();
}
function setMusic(on){
  if(!on){musicPlaying=false;playRequest++;audio.pause();musicBtn.textContent='♫ MUSIC OFF';return}
  musicPlaying=true;
  musicBtn.textContent='♫ MUSIC ON';
  if(!currentTrack||!audio.src){playRandomTrack();return}
  const request=++playRequest;
  audio.play().then(()=>{if(request===playRequest)musicBtn.textContent='♫ MUSIC ON'}).catch(error=>{
    if(request!==playRequest)return;
    if(error&&error.name!=='NotAllowedError'&&error.name!=='AbortError'){musicPlaying=true;playRandomTrack()}else musicBtn.textContent='♫ MUSIC ON';
  });
}
audio.addEventListener('ended',()=>{if(musicPlaying)playRandomTrack()});

function burst(x,y){for(let i=0;i<18;i++){const p=document.createElement('i');p.textContent='✦';p.style.cssText=`position:fixed;left:${x}px;top:${y}px;z-index:70;color:${i%2?'#d1a457':'#fff0b8'};font-style:normal;font-size:${8+Math.random()*10}px;pointer-events:none;transition:transform .9s ease,opacity .9s`;document.body.append(p);requestAnimationFrame(()=>{p.style.transform=`translate(${(Math.random()-.5)*120}px,${(Math.random()-.5)*120}px) scale(.2)`;p.style.opacity='0'});setTimeout(()=>p.remove(),1000)}}
document.querySelectorAll('.scratch-card canvas').forEach((canvas,idx)=>{
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  let drawing=false,done=false,checks=0,lastPoint=null;
  function paint(){
    const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalCompositeOperation='source-over';
    ctx.fillStyle=getComputedStyle(app).getPropertyValue('--lilac').trim()||'#B695C0';ctx.fillRect(0,0,r.width,r.height);
    ctx.fillStyle=getComputedStyle(app).getPropertyValue('--wine').trim()||'#fff';ctx.font='700 9px "Plus Jakarta Sans"';ctx.textAlign='center';
    ctx.fillText(['Month','Day','Year'][idx]+' ✦ SCRATCH',r.width/2,r.height/2+3);ctx.globalCompositeOperation='destination-out';
  }
  paint();new ResizeObserver(paint).observe(canvas);
  function pos(e){const r=canvas.getBoundingClientRect(),pt=e.touches?e.touches[0]:e;return{x:pt.clientX-r.left,y:pt.clientY-r.top}}
  function erase(e){
    if(!drawing||done)return;e.preventDefault();const p=pos(e);
    ctx.save();ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';
    if(!lastPoint){ctx.beginPath();ctx.arc(p.x,p.y,10+Math.random()*7,0,Math.PI*2);ctx.fill()}
    else{
      const dx=p.x-lastPoint.x,dy=p.y-lastPoint.y,distance=Math.hypot(dx,dy),steps=Math.max(2,Math.ceil(distance/7));
      const nx=distance?-dy/distance:0,ny=distance?dx/distance:1;
      ctx.globalAlpha=.88;ctx.lineWidth=19+Math.random()*7;ctx.beginPath();
      for(let i=0;i<=steps;i++){
        const t=i/steps,jitter=(Math.random()-.5)*3,x=lastPoint.x+dx*t+nx*jitter,y=lastPoint.y+dy*t+ny*jitter;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);

      for(let strand=0;strand<5;strand++){
        const offset=(Math.random()-.5)*23;ctx.globalAlpha=.2+Math.random()*.42;ctx.lineWidth=1.2+Math.random()*3;ctx.beginPath();
        const j1=(Math.random()-.5)*4,j2=(Math.random()-.5)*4;
        ctx.moveTo(lastPoint.x+nx*(offset+j1),lastPoint.y+ny*(offset+j1));
        ctx.lineTo(p.x+nx*(offset+j2),p.y+ny*(offset+j2));ctx.stroke();
      }
    }

  }
  function measure(){

  }
  canvas.addEventListener('pointerdown',e=>{drawing=true;lastPoint=null;canvas.setPointerCapture(e.pointerId);erase(e)});
  canvas.addEventListener('pointermove',erase);
  canvas.addEventListener('pointerup',()=>{drawing=false;lastPoint=null;measure()});
  canvas.addEventListener('pointercancel',()=>{drawing=false;lastPoint=null});
});

// Gentle falling petals and glints; canvas scales with viewport.
const fx=document.getElementById('petals'),fctx=fx.getContext('2d');let flakes=[];function resizeFx(){const dpr=Math.min(devicePixelRatio||1,2);fx.width=innerWidth*dpr;fx.height=innerHeight*dpr;fx.style.width=innerWidth+'px';fx.style.height=innerHeight+'px';fctx.setTransform(dpr,0,0,dpr,0,0);flakes=Array.from({length:30},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:2+Math.random()*4,v:.35+Math.random()*.75,a:Math.random()*6.28,w:Math.random()*.02,petal:Math.random()>.3}))}addEventListener('resize',resizeFx);resizeFx();function animateFx(){fctx.clearRect(0,0,innerWidth,innerHeight);for(const p of flakes){p.y+=p.v;p.x+=Math.sin(p.a)*.45;p.a+=p.w;if(p.y>innerHeight+12){p.y=-10;p.x=Math.random()*innerWidth}if(p.petal){fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.a);fctx.fillStyle='rgba(224,153,170,.42)';fctx.beginPath();fctx.ellipse(0,0,p.s*.65,p.s*1.3,0,0,Math.PI*2);fctx.fill();fctx.restore()}else{fctx.fillStyle='rgba(202,163,91,.65)';fctx.font=`${p.s*2+4}px serif`;fctx.fillText('✦',p.x,p.y)}}requestAnimationFrame(animateFx)}animateFx();
